name: Release

# Publish a GitHub Release whenever a version tag is pushed, e.g.
#   git tag v0.0.1 && git push origin v0.0.1
on:
  push:
    tags:
      - "v*"

# softprops/action-gh-release needs write access to create the release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: plasmo build regenerates .plasmo/index.d.ts (the ambient
      # types for `~` aliases and `data-text:` imports) that the typecheck and
      # tsconfig depend on but which isn't committed.
      - name: Build extension
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Package extension
        run: pnpm package

      # Rename so the release asset carries the version tag instead of the
      # fixed plasmo output name (chrome-mv3-prod.zip).
      - name: Name artifact with version
        run: mv build/chrome-mv3-prod.zip build/video-assistant-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Video Assistant ${{ github.ref_name }}
          generate_release_notes: true
          files: build/video-assistant-${{ github.ref_name }}.zip
