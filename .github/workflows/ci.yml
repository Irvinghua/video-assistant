name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: plasmo build regenerates .plasmo/index.d.ts (the ambient
      # types for `~` aliases and `data-text:` imports) that the typecheck and
      # tsconfig depend on but which isn't committed.
      - name: Build extension
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Package extension
        run: pnpm package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-prod
          path: build/chrome-mv3-prod.zip
          if-no-files-found: error
